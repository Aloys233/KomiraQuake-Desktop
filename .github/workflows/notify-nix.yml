name: "Notify nix-packages on Release"

# Release 发布后再通知 nix-packages 更新：tag 一推就发会早于安装包上传完成，
# 等 Release published 更稳妥。注意：Release 必须用 PAT 创建，GITHUB_TOKEN
# 创建的事件不会触发本 workflow（见 release.yml 的 token 设置）。
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to trigger (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger nix-packages update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: Aloys233/nix-packages
          event-type: update-komiraquake
          client-payload: '{"version": "${{ steps.tag.outputs.version }}"}'
